[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pyrite-chem"
dynamic = ["version"]  # from pyrite/__init__.py
description = "A Python toolkit for molecular docking: molecules, poses, scoring functions and searches"
readme = "README.md"
# The LICENSE is a custom non-commercial license, not an OSI license: no license classifier.
license = "LicenseRef-Pyrite-Non-Commercial"
license-files = ["LICENSE"]
authors = [
  { name = "Mart Johanan van der Lugt" },
  { name = "David Alonzo Poole III" },
]
requires-python = ">=3.10"
keywords = ["molecular docking", "scoring functions", "cheminformatics", "drug discovery"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=1.25",
  "scipy>=1.10",
  "numba>=0.59",
  "rdkit>=2023.9",
  "py3Dmol>=2.0",
  "ipython>=8.0",
  "ipywidgets>=8.0",
]

[project.optional-dependencies]
# Only for pyrite.io.fix_receptor_pdb
pdbfixer = ["openmm>=8.0", "pdbfixer>=1.9"]
dev = ["pytest", "ruff>=0.16,<0.17"]
docs = [
  "sphinx>=8.1",
  "numpydoc>=1.8",
  "myst-nb>=1.2",
  "matplotlib",
  "shibuya>=2026.7.12",
  "sphinx-copybutton",
  "sphinx-design",
  "sphinx-togglebutton",
  "sphinxcontrib-mermaid",
  "sphinx-iconify",
  "sphinx-sitemap",
  "sphinx-docsearch",
]

[project.urls]
Documentation = "https://poolechem.github.io/Pyrite/"
Source = "https://github.com/PooleChem/Pyrite"
Issues = "https://github.com/PooleChem/Pyrite/issues"

[tool.hatch.version]
path = "pyrite/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["pyrite"]

[tool.hatch.build.targets.sdist]
include = ["pyrite", "tests", "examples/input_files", "README.md", "LICENSE", "CITATION.cff"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["doc", "*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "D"]
# D1xx are the "missing docstring" rules; requiring docstrings everywhere is a separate policy.
# D401 (imperative summary) is left to numpydoc's own validation in doc/source/conf.py (SS05),
# which applies numpy's rule exactly: functions start with an infinitive verb, while classes and
# properties may be described ("Represents ...", "The layout of ...").
ignore = ["D1", "D401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
# These module docstrings are reST pages (a title block, then sections), rendered as the API pages
# of the docs: their first line is a title, not a summary sentence.
"pyrite/bounds.py" = ["D205", "D400"]
"pyrite/scoring/__init__.py" = ["D205", "D400"]
"pyrite/scoring/dependencies.py" = ["D205", "D400"]
"pyrite/search/__init__.py" = ["D205", "D400"]
"pyrite/cluster.py" = ["D205", "D400"]
"pyrite/io.py" = ["D205", "D400"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
# The repository root on the path: the tests run on the source, installed or not.
pythonpath = ["."]
testpaths = ["tests"]
